version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placementiq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: placementiq
      POSTGRES_USER: placementiq_user
      POSTGRES_PASSWORD: placementiq_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/triggers_and_procedures.sql:/docker-entrypoint-initdb.d/02-triggers.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementiq-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://placementiq_user:placementiq_pass@postgres:5432/placementiq"
      JWT_SECRET: "placementiq-docker-dev-secret"
      JWT_EXPIRES_IN: "7d"
      PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placementiq-ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000"
    depends_on:
      - backend

volumes:
  pgdata:
